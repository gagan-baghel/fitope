<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitOpe — offline</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; font: 16px/1.5 system-ui, sans-serif; background: #eef1f5; color: #12161c; }
  @media (prefers-color-scheme: dark) { body { background: #0c0f13; color: #eef1f5; } }
  main { text-align: center; padding: 24px; }
  .big { font-size: 64px; line-height: 1; }
  button { margin-top: 20px; font: 600 16px system-ui; padding: 14px 28px; border: 0; border-radius: 16px; background: #c9f24e; color: #12161c; }
</style>
</head>
<body>
<main>
  <div class="big">📶</div>
  <h1 style="margin:16px 0 4px;font-size:22px">No internet</h1>
  <p style="margin:0;opacity:.7">FitOpe will be back as soon as you're online.</p>
  <button onclick="location.reload()">↻ Try again</button>
</main>
</body>
</html>
